name: ci

# check   - lint, format, the Node tests of the control, the package contents,
#           the packed package built in an app of its own with UI5 CLI 3 and
#           4, abaplint over the examples' ABAP, the builds of the examples
#           (the control has to land in dist/thirdparty/), and that every
#           example takes the one copy of the control at the root of the
#           workspace - packages/embed-control, linked by npm
# floor   - the backend floor the package records, for the e2e leg against it
# bsp     - the branches standard and rap (scripts/build-bsp.mjs), built and
#           checked with abap2UI5's BSP tools from its main: a change that
#           breaks them shows here, not in the delivery after the merge
# e2e     - the examples in a browser against a live abap2UI5 backend,
#           transpiled to JavaScript and served by its express server - no
#           SAP system involved. The control loads the frontend from that
#           backend (?z2ui5-bundle), so what is tested is what a user gets:
#           these examples, the control of this commit and an abap2UI5.
#           Twice: against abap2UI5 main (npm run express in a checkout), and
#           against the backend floor the package records -
#           "abap2ui5".minBackend in packages/embed-control/package.json,
#           abap2UI5 1.150.0 today - the published @abap2ui5/node-runtime of
#           that version (job floor reads it, so the leg cannot drift from the
#           package). A floor that is not published yet - the control raised
#           it ahead of the release - skips the leg, and job floor says so.
#           The floor leg leaves out the tests tagged @after-<floor>

on:
  pull_request:
  # abap2UI5 changes without a pull request here, and the e2e job tests
  # against its current main - so everything runs every night as well, and a
  # change there that breaks the control or an example shows up the next
  # morning
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  # deliver.yaml runs all of it on every push to main, before it delivers;
  # publish.yaml on the commit it publishes
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # One copy of the control, at the root, and it is the workspace
      # package: the examples' range has to cover the version of
      # packages/embed-control, or npm takes one from the registry - and the
      # examples, the e2e tests and the branches would run that one
      - name: Every example takes the control of this commit
        if: ${{ !cancelled() }}
        run: |
          test "$(realpath node_modules/@abap2ui5/embed-control)" = "$(realpath packages/embed-control)"
          for example in examples/*/package.json; do
            test ! -e "$(dirname "$example")/node_modules/@abap2ui5/embed-control"
          done
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm test
        if: ${{ !cancelled() }}
      - run: npm run format:check
        if: ${{ !cancelled() }}
      - run: npm run pack:check
        if: ${{ !cancelled() }}
      # the tarball, installed into an app outside this workspace and built
      # with UI5 CLI 3 and 4 - what a consumer gets, on every CLI major a
      # consumer may have
      - run: npm run consumer:check
        if: ${{ !cancelled() }}
      # the ABAP of the examples (abaplint.jsonc), against abap2UI5's main
      - run: npm run abaplint
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
      # the consumer build: the control is copied into each app
      # (includeDependency in its ui5.yaml), next to it and not under
      # resources/ - the Fiori elements apps as much as the freestyle one, and
      # the card, which is deployed on its own and registers the control
      # relative to itself - without its preview page
      - name: The control is part of the built apps
        if: ${{ !cancelled() }}
        run: |
          for example in freestyle fiori-elements fiori-elements-v2 card; do
            test -f "examples/$example/dist/thirdparty/z2ui5/embed/Container.js"
            test ! -e "examples/$example/dist/resources"
          done
          test -f examples/card/dist/manifest.json
          test ! -e examples/card/dist/test

  # the backend floor the package states - "abap2ui5".minBackend in its
  # package.json - for the e2e leg against it. Read from the file rather
  # than written here again, so the version the leg installs is the version
  # the package names. Raise it there, with the READMEs
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.read.outputs.backend }}
      published: ${{ steps.read.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: packages/embed-control/package.json
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          backend=$(jq -er '.abap2ui5.minBackend' packages/embed-control/package.json)
          echo "$backend" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "the backend floor is abap2UI5 $backend"
          if npm view "@abap2ui5/node-runtime@$backend" version 2>/dev/null | grep -q .; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@abap2ui5/node-runtime $backend is not published yet - the e2e leg against the floor is skipped"
          fi

  bsp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the BSP tools only - they need nothing but node
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/abap2UI5
          path: .abap2ui5
          sparse-checkout: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run bsp
        env:
          ABAP2UI5_DIR: .abap2ui5

  e2e:
    name: e2e (abap2UI5 ${{ matrix.backend }})
    needs: floor
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # the floor leg, when the floor is not published yet (job floor)
      SKIP: ${{ matrix.backend != 'main' && needs.floor.outputs.published != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: main
            playwright-args: ""
          # the floor, from the package (job floor). A test that needs a
          # newer backend is tagged @after-<floor>, and the leg leaves it
          # out - with the floor raised, it runs. The project names are the
          # ones of playwright.config.mjs
          - backend: ${{ needs.floor.outputs.backend }}
            playwright-args: >-
              --project ui5-1.136 --project ui5-1.71 --project card
              --grep-invert @after-${{ needs.floor.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SKIP != 'true' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SKIP != 'true' && matrix.backend == 'main' }}
        with:
          repository: abap2UI5/abap2UI5
          path: .abap2ui5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ env.SKIP != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .abap2ui5/package-lock.json

      - name: Build the abap2UI5 backend
        if: ${{ env.SKIP != 'true' && matrix.backend == 'main' }}
        working-directory: .abap2ui5
        run: |
          npm ci
          npm run downport
          npm run auto_transpile
      - name: Install the published abap2UI5 ${{ matrix.backend }}
        if: ${{ env.SKIP != 'true' && matrix.backend != 'main' }}
        run: |
          mkdir .abap2ui5 && cd .abap2ui5
          # a manifest of its own: `npm init -y` names the package after the
          # directory, and ".abap2ui5" is no valid package name
          printf '{ "name": "abap2ui5-backend", "private": true }\n' > package.json
          npm install --no-audit --no-fund \
            "@abap2ui5/node-runtime@${{ matrix.backend }}" express@5
          cat > serve.mjs <<'JS'
          import { serve } from "@abap2ui5/node-runtime";
          await serve({ port: 3000, host: "127.0.0.1" });
          JS
      - name: Start it on port 3000
        if: ${{ env.SKIP != 'true' }}
        working-directory: .abap2ui5
        run: |
          if [ "${{ matrix.backend }}" = main ]; then
            HOST=127.0.0.1 PORT=3000 nohup npm run express > "$RUNNER_TEMP/express.log" 2>&1 &
          else
            nohup node serve.mjs > "$RUNNER_TEMP/express.log" 2>&1 &
          fi
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/express.log"
          exit 1

      - run: npm ci
        if: ${{ env.SKIP != 'true' }}
      - run: npx playwright install --with-deps chromium
        if: ${{ env.SKIP != 'true' }}
      - run: npx playwright test ${{ matrix.playwright-args }}
        if: ${{ env.SKIP != 'true' }}
        env:
          CI: "true"
      - if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/express.log"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.backend }}
          path: playwright-report/
          retention-days: 7
